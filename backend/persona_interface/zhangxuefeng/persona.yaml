  layer1_prompt: "prompt.txt"           # 核心提示词（每次对话必带）
  layer2_knowledge: "knowledge.md"      # 思维模型+决策启发+表达DNA（按需加载）
  layer3_references: "references/"      # 原始调研资料（深度回答时按需检索）
